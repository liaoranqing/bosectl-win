name: Release

# Publishing a release is a single action: push a tag.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The workflow then verifies the tag matches the version recorded in the
# source, runs the full test suite, builds both executables on a Windows
# runner, smoke-tests them, and attaches them (with checksums and release
# notes) to a GitHub Release. Nothing is built locally and no secrets are
# required beyond the automatic GITHUB_TOKEN.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write        # needed to create the Release

jobs:
  # ── gate: fail fast before spending build time ───────────────────────────
  validate:
    name: Validate ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm the tag matches the source version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          python scripts/check_version.py "$tag"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # -rc / -beta / -alpha suffixes mark a pre-release.
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the test suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pytest tests -q

  # ── build both executables ───────────────────────────────────────────────
  build:
    name: Build ${{ matrix.artifact }}
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: gui
            spec: build/BoseCtl-window.spec
            artifact: BoseCtl.exe
          - target: cli
            spec: build/bosectl-console.spec
            artifact: bosectl.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Regenerate the application icon
        # Generated, not committed — see .gitignore. Both specs need it.
        run: python build/make_icon.py

      - name: Build
        run: pyinstaller --clean --noconfirm --workpath build/work --distpath dist ${{ matrix.spec }}

      - name: Smoke-test the console build
        if: matrix.target == 'cli'
        shell: pwsh
        run: |
          $exe = "dist/bosectl.exe"
          & $exe --version
          & $exe --mock status | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "frozen CLI failed" }

      - name: Smoke-test the windowed build
        if: matrix.target == 'gui'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath (Resolve-Path "dist/BoseCtl.exe") `
                                -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 20
          $proc.Refresh()
          if ($proc.HasExited) { throw "GUI exited during startup ($($proc.ExitCode))" }
          Stop-Process -Id $proc.Id -Force

      - name: Write the checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Out-File -Encoding ascii "dist/${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  # ── publish ──────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble SHA256SUMS
        working-directory: dist
        run: |
          cat *.sha256 | sort > SHA256SUMS
          rm -f *.sha256
          ls -l
          cat SHA256SUMS

      - name: Extract the changelog section for this version
        id: notes
        shell: bash
        run: |
          version="${{ needs.validate.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            # Everything under the matching "## [x.y.z]" heading, up to the
            # next heading at the same level.
            awk -v v="$version" '
              $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > body.md
          fi
          if [ ! -s body.md ]; then
            {
              echo "Windows port of [bosectl](https://github.com/aaronsb/bosectl)."
              echo
              echo "### Downloads"
              echo
              echo "- \`BoseCtl.exe\` — desktop app, no install, double-click to run."
              echo "- \`bosectl.exe\` — command line (\`bosectl.exe --help\`)."
              echo
              echo "Verify integrity against \`SHA256SUMS\` in this release."
            } > body.md
          fi
          cat body.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: BoseCtl for Windows ${{ needs.validate.outputs.version }}
          body_path: body.md
          prerelease: ${{ needs.validate.outputs.prerelease }}
          draft: false
          generate_release_notes: false
          files: |
            dist/BoseCtl.exe
            dist/bosectl.exe
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
