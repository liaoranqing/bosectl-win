[project]
name = "bosectl-win"
version = "1.0.0"
description = "Control Bose headphones over BMAP from Windows — CLI and desktop GUI, no app, no cloud, no account"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "bosectl-win contributors" },
]
maintainers = [
    { name = "bosectl-win contributors" },
]
keywords = [
    "bluetooth", "bmap", "bose", "headphones", "noise-cancellation",
    "windows", "quietcomfort", "desktop-app",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]

# The BMAP library itself needs nothing beyond the standard library: the
# Bluetooth transport is a ctypes binding to Winsock. customtkinter is only
# required for the desktop GUI, so it is an extra rather than a hard
# dependency.
dependencies = []

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
    "pillow>=9.0",
    "customtkinter>=5.2",
]

[project.urls]
"Upstream project" = "https://github.com/aaronsb/bosectl"
Documentation = "https://github.com/aaronsb/bosectl"

[project.scripts]
bosectl = "pybmap.cli:main"
bosectl-win = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pybmap", "gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: requires a paired Bluetooth device (pass --integration)",
]

[tool.ruff]
line-length = 100
target-version = "py39"

extend-exclude = [
    # PyInstaller specs are executed with PyInstaller's own globals injected
    # (SPECPATH, Analysis, EXE, ...); they are not importable modules.
    "build",
    # Vendored verbatim from upstream bosectl. Keeping them byte-identical is
    # the whole point (see NOTICE), so they are not ours to lint: fixing a
    # finding here would break the diff-against-upstream guarantee.
    "pybmap/protocol.py",
    "pybmap/constants.py",
    "pybmap/types.py",
    "pybmap/errors.py",
    "pybmap/catalog.py",
    "pybmap/connection.py",
    "pybmap/cli.py",
    "pybmap/devices/",
    "tests/test_{catalog,channel_probe,cli,connection,connection_mock,device_parsers,integration,protocol,qc45,qc_earbuds,qc_prince,qc_ultra2}.py",
]

[tool.ruff.lint]
# An explicit selection rather than the defaults. Ruff's default rule set has
# grown between releases, and a lint gate that starts failing on its own is
# not a gate. These are the rules that catch actual mistakes — undefined
# names, unused imports and variables, syntax-level errors, import order —
# without the stylistic churn that would swamp the Windows-port diff.
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# The CLI wrapper deliberately re-exports and patches names for monkeypatching.
"tests/*.py" = ["E402"]
