[project]
name = "bosectl-win"
version = "1.0.0"
description = "Control Bose headphones over BMAP from Windows — CLI and desktop GUI, no app, no cloud, no account"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "bosectl-win contributors" },
]
maintainers = [
    { name = "bosectl-win contributors" },
]
keywords = [
    "bluetooth", "bmap", "bose", "headphones", "noise-cancellation",
    "windows", "quietcomfort", "desktop-app",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]

# The BMAP library itself needs nothing beyond the standard library: the
# Bluetooth transport is a ctypes binding to Winsock. customtkinter is only
# required for the desktop GUI, so it is an extra rather than a hard
# dependency.
dependencies = []

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
    "pillow>=9.0",
    "customtkinter>=5.2",
]

[project.urls]
"Upstream project" = "https://github.com/aaronsb/bosectl"
Documentation = "https://github.com/aaronsb/bosectl"

[project.scripts]
bosectl = "pybmap.cli:main"
bosectl-win = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pybmap", "gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: requires a paired Bluetooth device (pass --integration)",
]

[tool.ruff]
line-length = 100
target-version = "py39"
